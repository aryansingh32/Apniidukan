services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apniidukan
    ports:
      # Host-side 5433 (not 5432) so this doesn't collide with any Postgres
      # you already have running locally. Containers still talk to each
      # other over the internal "postgres:5432" hostname regardless of this
      # mapping — only change this if you need `psql` from the host itself.
      - "5433:5432"
    volumes:
      - apniidukan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apniidukan?schema=public
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRES_IN: 30d
      ADMIN_JWT_SECRET: dev-admin-secret-change-in-production
      PORT: 3000
      UPI_ID: apniidukan.distributors@okicici
      UPI_PAYEE_NAME: Apniidukan Distributors
    ports:
      - "3000:3000"

  admin:
    build:
      context: ./apps/admin
      args:
        # Must be reachable from your browser on the host, not the Docker
        # network — the backend's port is published to localhost above.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  apniidukan_pgdata:
